server.port=8080
spring.application.name=ai-chatbot-backend

# Toggle authentication (set true to enforce JWT auth)
app.security.auth-enabled=${APP_SECURITY_AUTH_ENABLED:false}

# OAuth2 Resource Server Configuration
# For Google OAuth2, use: https://accounts.google.com
# For Auth0, use: https://YOUR_DOMAIN
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:https://accounts.google.com}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

# JWT Token Configuration
# Authority claim name (default: permissions for Auth0, scope for Google)
jwt.authorities-claim-name=${JWT_AUTHORITIES_CLAIM_NAME:scope}
jwt.authority-prefix=${JWT_AUTHORITY_PREFIX:SCOPE_}

# Logging levels for debugging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# CORS allowed origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
