server.port=8081
spring.application.name=qa-agent

# ─── Vertex AI configuration ─────────────────────────────────────────────────
# Override these with environment variables or a local application-local.properties
vertex.ai.project=${GOOGLE_CLOUD_PROJECT:your-gcp-project-id}
vertex.ai.location=${GOOGLE_CLOUD_LOCATION:us-central1}
vertex.ai.model=${GEMINI_MODEL:gemini-2.0-flash}

# ─── Agent review-rework configuration ───────────────────────────────────────
# Number of review-and-rework cycles to run after the initial extraction.
# Set to 0 to skip review, or increase for more thorough refinement.
agent.review.rework.cycles=${AGENT_REVIEW_REWORK_CYCLES:1}

# ─── Multipart upload ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.agents.qaagent=INFO
