server.port=8081
spring.application.name=qa-agent

# ─── Vertex AI configuration ─────────────────────────────────────────────────
# Override these with environment variables or a local application-local.properties
vertex.ai.project=${GOOGLE_CLOUD_PROJECT:your-gcp-project-id}
vertex.ai.location=${GOOGLE_CLOUD_LOCATION:us-central1}
vertex.ai.model=${GEMINI_MODEL:gemini-2.0-flash}

# ─── Multipart upload ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.agents.qaagent=INFO
